[project]
name = "spectracoustic-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tdinapoli", email = "tomas.dina98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.2,<3",
    "scipy>=1.14.1,<2",
    "pandas>=2.2.3,<3",
    "matplotlib>=3.9.2,<4",
    "uncertainties>=3.2.2,<4",
    "openpyxl>=3.1.5,<4",
    "watchdog>=6.0.0",
]

[project.scripts]
photoacoustic = "spectracoustic_analysis.main:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "==3.12"
numpy = ">=2.1.2,<3"
scipy = ">=1.14.1,<2"
pandas = ">=2.2.3,<3"
matplotlib = ">=3.9.2,<4"
uncertainties = ">=3.2.2,<4"
openpyxl = ">=3.1.5,<4"
watchdog = "*"

[tool.uv.build-backend]
module-name = "spectracoustic_analysis"
module-root = "src"

[tool.pixi.tasks]
pack = 'python tools/build_pack.py'
sim = "python tools/simulate_data_acq.py"
